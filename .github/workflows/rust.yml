name: Rust

on: [push, pull_request]

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
    - name: Format
      uses: actions-rs/cargo@v1
      with:
        command: fmt
        args: --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        target: aarch64-linux-android
    - name: Clippy
      uses: actions-rs/cargo@v1
      with:
        command: clippy
        # Use one of our supported targets to lint all crates including
        # the target-specific `ndk` in one go.
        # This assumes our host-tools (cargo-apk and dependencies)
        # also compile cleanly under this target.
        args: --all --all-targets --all-features --target aarch64-linux-android -- -Dwarnings

  check_msrv:
    name: Check MSRV (1.60.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.60.0
        with:
          targets: aarch64-linux-android
      # Only the library is held to the MSRV, dev-dependencies and examples need newer toolchains.
      - run: cargo check -p ndk-context --lib --all-features --target aarch64-linux-android

  build:
    strategy:
      fail-fast: false
      matrix:
        os:  [ubuntu-latest]
        rust-channel: ['stable', 'nightly']
        rust-target:
          - 'armv7-linux-androideabi'
          - 'aarch64-linux-android'
          - 'i686-linux-android'
          - 'x86_64-linux-android'
        include:
          - os: windows-latest
            rust-channel: 'stable'
            rust-target: 'aarch64-linux-android'
          - os: windows-latest
            rust-channel: 'stable'
            rust-target: 'x86_64-linux-android'

    runs-on: ${{ matrix.os }}
    name: Build apk

    steps:
    - uses: actions/checkout@v2

    - name: Installing Rust ${{ matrix.rust-channel }} w/ ${{ matrix.rust-target }}
      uses: actions-rs/toolchain@v1
      with:
        toolchain: ${{ matrix.rust-channel }}
        target: ${{ matrix.rust-target }}
        override: true

    - name: Install cargo-apk
      run:
        cargo install cargo-apk

    - name: Cargo check for target ${{ matrix.rust-target }}
      run: cargo check -p ndk-context --target ${{ matrix.rust-target }} --all-features

    # `examples` targets SDK 29, which the runner images no longer ship.
    - name: Install Android platform 29
      if: runner.os != 'Windows'
      run: echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-29"

    - name: Install Android platform 29
      if: runner.os == 'Windows'
      shell: pwsh
      run: echo y | & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" "platforms;android-29"

    - name: Cargo apk build for target ${{ matrix.rust-target }}
      run: cargo apk build -p examples --target ${{ matrix.rust-target }} --examples

    - uses: actions/upload-artifact@v4
      # Only need this for CI, unless users are interested in downloading
      # a ready-made app that does nothing but printing "hello world".
      if: ${{ matrix.rust-target == 'x86_64-linux-android' }}
      name: Upload hello_world apk
      with:
        name: hello_world_${{ matrix.os }}_${{ matrix.rust-target }}
        path: ./target/debug/apk/examples/hello_world.apk

  android_emulator:
    name: hello_world example on emulator
    needs: build
    # The macOS runners are arm64 and cannot boot the x86_64 system image.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        source_os: [ubuntu-latest, windows-latest, local]
    env:
      api-level: 29
      emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
      arch: x86_64
      # the `googleapis` emulator target is considerably slower on CI.
      target: default
      profile: Nexus 6

    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - uses: actions/download-artifact@v4
      name: Download hello_world APK
      if: ${{ matrix.source_os != 'local' }}
      id: download
      with:
        name: hello_world_${{ matrix.source_os }}_x86_64-linux-android

    - name: Install `cargo-apk`, the `x86_64-linux-android` target and Android platform 29
      if: ${{ matrix.source_os == 'local' }}
      run: |
        cargo install cargo-apk
        rustup target add x86_64-linux-android
        echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-29"

    - name: Start hello_world example
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ env.api-level }}
        arch: ${{ env.arch }}
        target: ${{ env.target }}
        profile: ${{ env.profile }}
        emulator-options: -no-snapshot-save ${{ env.emulator-options }}
        disable-animations: true
        force-avd-creation: true
        script: ./.github/workflows/android_test.sh "${{ steps.download.outputs.download-path }}"

    - name: Upload emulator logs
      uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: log_${{ matrix.source_os }}
        path: ~/logcat.log

  build-host:
    strategy:
      fail-fast: false
      matrix:
        os:  [ubuntu-latest]
        rust-channel: ['stable', 'nightly']

    runs-on: ${{ matrix.os }}
    name: Host-side tests

    steps:
    - uses: actions/checkout@v2

    - name: Installing Rust ${{ matrix.rust-channel }}
      uses: actions-rs/toolchain@v1
      with:
        toolchain: ${{ matrix.rust-channel }}
        override: true

    - name: Test ndk-context
      run:
        cargo test -p ndk-context --all-features

  docs:
    strategy:
      fail-fast: false
      matrix:
        os:  [ubuntu-latest]
        rust-channel: ['stable', 'nightly']

    runs-on: ${{ matrix.os }}
    name: Build-test docs

    steps:
    - uses: actions/checkout@v2

    - name: Installing Rust ${{ matrix.rust-channel }}
      uses: actions-rs/toolchain@v1
      with:
        toolchain: ${{ matrix.rust-channel }}
        override: true

    - name: Document all crates
      env:
        RUSTDOCFLAGS: -Dwarnings
      run:
        cargo doc --all --all-features
